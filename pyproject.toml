[project]
name = "pydantic-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ada Student", email = "ada@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "logfire==5.2.0",
    "pydantic-ai==2.56.0",
    "pydantic-ai-harness==0.56.0",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
pydantic-tutor = "pydantic_tutor:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
extend-exclude = ["sample_code"]  # code the agent reads, not code you write

[tool.ruff.lint]
select = [
    "E", "W",  # style: pycodestyle
    "F",       # unused imports and names, undefined names
    "I",       # import order
    "N",       # PEP 8 names
    "UP",      # modern syntax for this Python
    "B",       # likely bugs
    "ANN",     # every parameter and return annotated; ANN401 flags Any
    "FBT",     # no booleans by position, in a call or a def
    "SIM",     # simpler equivalents
    "RUF",     # Ruff's own rules
]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
# Same reason [tool.mypy]'s exclude gives: a lesson's own test imports code
# that does not exist yet, on the start branch. Ruff sorts an import it
# cannot resolve differently from one it can, in the same block -- I001
# would otherwise flip depending on whether the student has done the
# lesson. Scoped to the one file this affects, not all of tests/.
"tests/02_04_chat/test_chat.py" = ["I001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "^tests/",         # the series' lesson tests refer to code you have not written yet
    "^sample_code/",  # code the agent reads, not code you write
]

[tool.pytest]
addopts = ["--ignore=sample_code"]  # the sample codebase's tests are not ours
